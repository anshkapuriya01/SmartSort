name: SmartSort
options:
  bundleIdPrefix: com.anshkapuriya
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmartSort:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        # Lets a build from source find the engine next to it (../engine/.venv).
        SmartSortSourceRoot: $(SRCROOT)/..
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshkapuriya.SmartSort
        PRODUCT_NAME: SmartSort
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmartSort
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: SmartSort organises the folders you choose.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: SmartSort organises the folders you choose.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: SmartSort organises the folders you choose.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SmartSort:
    build:
      targets:
        SmartSort: all
    run:
      config: Debug
      # Metal API validation makes PyTorch's GPU code abort inside the engine.
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
    archive:
      config: Release
