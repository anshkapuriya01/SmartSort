[project]
name = "smartsort-app"
version = "1.0.0"
description = "SmartSort's desktop app for Windows and Linux."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]   # plus the engine: pip install -e ../engine

[project.gui-scripts]
smartsort-app = "smartsort_app.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smartsort_app"]

[tool.setuptools.package-data]
smartsort_app = ["icon.png", "icon.ico"]
